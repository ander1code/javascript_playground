	utilizando querySelector e querySelectorAll, alterando estilos 
	e propriedades de botões, manipulando classes CSS (add, remove, contains, 
	toggle, className), iterando sobre NodeList com for...of, e associando

			<button type="button" id="btn3" name="btn3">CLICK</button>

		<br><br><br>

		<div id="div3">
			<button type="button" id="btn5" name="btn5">CLICK</button>
		</div>
		

		<style>
			button{
				color: white;
				width: 200px;
				height: 70px;
				cursor: pointer;
				border: 2px solid black;
			}

			.btn-success{
				background-color: green;
				
			}

			.btn-danger{
				background-color: red;
			}

			.btn-alert{
				background-color: blue;
			}

			.div-buttons{
				border: 10px solid black;
				width: 200px;
			}

		</style>


		<script type="text/javascript">

			let btn1 = document.querySelector("#btn1");

			btn1.classList.add("btn-success");
			btn1.textContent = "GREEN";
			
			btn1.addEventListener("click", () =>{
				if(btn1.classList.contains("btn-success")){
					btn1.classList.remove("btn-success");
					btn1.textContent = "RED";
					btn1.classList.add("btn-danger");

				}else{
					btn1.classList.remove("btn-danger");
					btn1.textContent = "GREEN";
					btn1.classList.add("btn-success")
				}
			});

			// listing all buttons:
			let buttons = document.querySelectorAll("#div2 > button");
			for(let button of buttons){
				button.classList.add("btn-alert");
				button.addEventListener("click", () => {
					alert(`Alert: ${button.name}`);
				});
			}


			let btn5 = document.querySelector("#btn5");

			//btn5.classList.add("btn-success");

			btn5.className = "btn-success";
			btn5.textContent = "CLICK";
			
			/*
			btn5.addEventListener("click", () =>{
				btn5.classList.toggle("btn-danger");
			});
			*/

			btn5.onclick = () => {
				btn5.classList.toggle("btn-danger");
			};

	<!-- FEITO POR IA
	/*
	20 - Crie uma função que demonstre a manipulação de eventos no
	DOM comparando a propriedade .onclick com o método .addEventListener(),
	implemente eventos de mouse (mouseenter e mouseleave) para alternar classes
	de estado em um elemento (.inactive e .active), controle estados dinâmicos
	em botões, e utilize temporizadores (setTimeout e setInterval) para disparar
	eventos de forma programática.
	*/
	-->

	<div id="20">

    	<style>

        .inactive {
            width: 400px;
            height: 400px;
            background-color: red;
            border: 1px solid black;
            cursor: pointer;
        }

        .active {
            width: 600px;
            height: 600px;
            background-color: lightgreen;
            border: 5px solid black;
            cursor: pointer;
        }

        #btn_update,
        #btn_timeout,
        #btn_interval,
        #btn_stop {
            width: 200px;
            height: 50px;
            margin-top: 10px;
            cursor: pointer;
        }

    	</style>

    	<div id="div-20">

        <!-- Elemento que terá seu estado alterado pelo mouse -->
        <div class="inactive" id="square"></div>

        <br>

        <!-- Botão para controlar o estado -->
        <button type="button" id="btn_update" data-enable="false">
            enable
        </button>

        <br>

        <!-- Botão para demonstrar setTimeout -->
        <button type="button" id="btn_timeout">
            setTimeout
        </button>

        <br>

        <!-- Botão para iniciar setInterval -->
        <button type="button" id="btn_interval">
            iniciar setInterval
        </button>

        <br>

        <!-- Botão para parar setInterval -->
        <button type="button" id="btn_stop">
            parar setInterval
        </button>


        <script>

            // =========================================================
            // 1. MOUSEENTER E MOUSELEAVE
            // =========================================================

            let square = document.querySelector("#square");


            // Quando o mouse entra na div
            square.addEventListener("mouseenter", () => {

                if (square.classList.contains("inactive")) {

                    square.classList.remove("inactive");
                    square.classList.add("active");

                }

            });


            // Quando o mouse sai da div
            square.addEventListener("mouseleave", () => {

                if (square.classList.contains("active")) {

                    square.classList.remove("active");
                    square.classList.add("inactive");

                }

            });


            // =========================================================
            // 2. .onclick
            // =========================================================

            let btn_update = document.querySelector("#btn_update");


            btn_update.onclick = () => {

                if (btn_update.dataset.enable === "false") {

                    btn_update.dataset.enable = "true";
                    btn_update.textContent = "disable";

                    console.log("Botão habilitado");

                } else {

                    btn_update.dataset.enable = "false";
                    btn_update.textContent = "enable";

                    console.log("Botão desabilitado");

                }

            };


            // =========================================================
            // 3. .addEventListener()
            // =========================================================

            let btn_timeout = document.querySelector("#btn_timeout");


            btn_timeout.addEventListener("click", () => {

                console.log("setTimeout iniciado...");

                setTimeout(() => {

                    console.log("Evento disparado depois de 3 segundos!");

                    btn_update.click();

                }, 3000);

            });


            // =========================================================
            // 4. setInterval()
            // =========================================================

            let btn_interval = document.querySelector("#btn_interval");

            let intervalo = null;


            btn_interval.addEventListener("click", () => {

                // Evita criar vários intervalos
                if (intervalo !== null) {
                    return;
                }


                console.log("setInterval iniciado");


                intervalo = setInterval(() => {

                    console.log(
                        "Intervalo executado:",
                        new Date().toLocaleTimeString()
                    );

                    // Dispara o evento click programaticamente
                    btn_update.click();

                }, 2000);

            });


            // =========================================================
            // 5. clearInterval()
            // =========================================================

            let btn_stop = document.querySelector("#btn_stop");


            btn_stop.addEventListener("click", () => {

                if (intervalo !== null) {

                    clearInterval(intervalo);

                    intervalo = null;

                    console.log("setInterval parado");

                }

            });
        </script>

    	</div>
	</div>

		<div id="container1" class="container">

			let rows1 = ["#row1", "#row2", "#row3", "#row4"];

	<!--
	/*
	22 - Demonstre o gerenciamento de eventos de foco (focusin, focusout e focus),
	e o carregamento dinâmico de rotinas e ouvintes utilizando mouseenter e
	removeEventListener()
	*/
	-->

	<div id="22">

	    <style>

	        #div-22 {
	            width: 500px;
	            padding: 30px;
	            margin: 50px auto;
	            border: 2px solid black;
	        }

	        input {
	            display: block;
	            width: 300px;
	            height: 35px;
	            margin: 10px 0;
	            padding: 5px;
	        }

	        .focus {
	            background-color: lightgreen;
	            border: 3px solid green;
	        }

	        .focusin {
	            background-color: lightblue;
	        }

	        .focusout {
	            background-color: lightcoral;
	        }

	        button {
	            width: 200px;
	            height: 40px;
	            margin-top: 10px;
	            cursor: pointer;
	        }

	    </style>


    	<div id="div-22">

	        <h2>Eventos de Foco</h2>

	        <input
	            type="text"
	            id="input1"
	            placeholder="Digite alguma coisa..."
	        >

	        <input
	            type="text"
	            id="input2"
	            placeholder="Outro campo..."
	        >

	        <button type="button" id="btn-remove">
	            Remover eventos
	        </button>

	        <p id="message">
	            Passe o mouse sobre o primeiro campo.
	        </p>

	    	</div>


    	<script>

	        // =========================================================
	        // 1. SELECIONANDO OS ELEMENTOS
	        // =========================================================

	        let input1 = document.querySelector("#input1");
	        let input2 = document.querySelector("#input2");
	        let btnRemove = document.querySelector("#btn-remove");
	        let message = document.querySelector("#message");


	        // =========================================================
	        // 2. EVENTO FOCUS
	        // =========================================================
	        // focus dispara quando o elemento recebe foco.
	        // =========================================================

	        function eventoFocus(event) {

	            console.log("FOCUS:", event.target.id);

	            event.target.classList.add("focus");

	            message.textContent =
	                `${event.target.id} recebeu foco.`;

	        }


	        // =========================================================
	        // 3. EVENTO FOCUSIN
	        // =========================================================
	        // focusin também ocorre quando o elemento recebe foco
	        // e possui propagação (bubbling).
	        // =========================================================

	        function eventoFocusin(event) {

	            console.log("FOCUSIN:", event.target.id);

	            event.target.classList.add("focusin");

	        }


	        // =========================================================
	        // 4. EVENTO FOCUSOUT
	        // =========================================================
	        // focusout ocorre quando o elemento perde o foco.
	        // =========================================================

	        function eventoFocusout(event) {

	            console.log("FOCUSOUT:", event.target.id);

	            event.target.classList.remove("focus");
	            event.target.classList.remove("focusin");
	            event.target.classList.add("focusout");

	            message.textContent =
	                `${event.target.id} perdeu o foco.`;

	        }


	        // =========================================================
	        // 5. REGISTRANDO OS EVENTOS DE FOCO
	        // =========================================================

	        input1.addEventListener("focus", eventoFocus);
	        input1.addEventListener("focusin", eventoFocusin);
	        input1.addEventListener("focusout", eventoFocusout);

	        input2.addEventListener("focus", eventoFocus);
	        input2.addEventListener("focusin", eventoFocusin);
	        input2.addEventListener("focusout", eventoFocusout);


	        // =========================================================
	        // 6. MOUSEENTER
	        // =========================================================
	        // Quando o mouse entra no primeiro input, carregamos
	        // dinamicamente uma rotina de evento.
	        // =========================================================

	        function carregarRotina() {

	            console.log("Rotina carregada pelo mouseenter.");

	            input1.addEventListener("focus", rotinaDinamica);

	            message.textContent =
	                "Rotina de foco carregada dinamicamente.";

	        }


	        // =========================================================
	        // 7. ROTINA DINÂMICA
	        // =========================================================

	        function rotinaDinamica() {

	            console.log(
	                "Evento de foco da rotina dinâmica executado!"
	            );

	        }


	        // =========================================================
	        // 8. MOUSEENTER CARREGA A ROTINA
	        // =========================================================

	        input1.addEventListener("mouseenter", carregarRotina);


	        // =========================================================
	        // 9. REMOVENDO EVENTOS
	        // =========================================================

	        btnRemove.addEventListener("click", () => {

	            input1.removeEventListener("focus", eventoFocus);
	            input1.removeEventListener("focusin", eventoFocusin);
	            input1.removeEventListener("focusout", eventoFocusout);

	            input2.removeEventListener("focus", eventoFocus);
	            input2.removeEventListener("focusin", eventoFocusin);
	            input2.removeEventListener("focusout", eventoFocusout);

	            input1.removeEventListener("mouseenter", carregarRotina);

	            input1.removeEventListener("focus", rotinaDinamica);

	            console.log("Eventos removidos!");

	            message.textContent =
	                "Eventos de foco removidos.";

	        });
	    </script>

		<script type="text/javascript">

					td1.textContent = p.id;
					let td2 = document.createElement("td");
					td2.textContent = p.name;
					tr.appendChild(td1);
					tr.appendChild(td2);
					tbody.appendChild(tr);
				}
			}

			function request_xmlhttprequest(){

				console.log("request_xmlhttprequest");

				let xmlhttp = new XMLHttpRequest();
				xmlhttp.onreadystatechange = function(){
					if(xmlhttp.readyState === 4){
						if(xmlhttp.status === 200){
							let people = JSON.parse(xmlhttp.responseText);
            				set_people_to_table(people);
						}
					}
				}

				xmlhttp.timeout = 5000;
				xmlhttp.onerror = () => console.log("XMLHttpRequest error.");
				xmlhttp.ontimeout = () => console.log("timeout error.");

				function handleGet(){
					btnGet.addEventListener("click", () => {
						console.log("GET: ");
						xmlhttp.open("GET", "http://127.0.0.1/html-js/people.json");
						xmlhttp.send();
					});
				}
				let btnGet = document.querySelector("#btnGet");
				btnGet.removeEventListener("click", handleGet);
				btnGet.addEventListener("click", handleGet);

				function handlePost(){
					console.log("POST: ");
					xmlhttp.open("POST", "http://127.0.0.1/html-js/people.json");
					xmlhttp.setRequestHeader("Content-type", "application/json");
					xmlhttp.send(JSON.stringify({
						id: 11,
						name: "Vanessa"
					}));
				}
				let btnPost = document.querySelector("#btnPost");
				btnPost.removeEventListener("click", handlePost);
				btnPost.addEventListener("click", handlePost);
			}

			function request_fetch_api(){

				console.log("request_fetch_api");

				function get(){

					console.log("GET:\n");

					fetch("http://127.0.0.1/html-js/people.json", {
						method: "GET",
					}).then((response) => {
						if(!response.ok){
							throw new Error(`fetching error: ${response.status}`);
						}else{
							return response.json();
						}
					}).then((response) => {
						set_people_to_table(response);
					}).catch((error) => {
						console.log(error);
					});
				}

				function post(){

					console.log("POST:\n");

					fetch("http://127.0.0.1/html-js/people.json", {
						method: "POST",
						body: JSON.stringify({
							id: 11,
							name: "Vanessa"
						}),
						headers: {"Content-type": "application/json"}
					}).then((response) => {
						if(!response.ok){
							throw new Error(`fetching error: ${response.status}`);
						}else{
							return response.json();
						}
					}).then((response) => {
						set_people_to_table(response);
					}).catch((error) => {
						console.log(error);
					});
				}

				function handlerGet() {
				    get();
				}

				function handlerPost() {
				    post();
				}

				let btnGet = document.querySelector("#btnGet");
				btnGet.removeEventListener("click", handlerGet);
				btnGet.addEventListener("click", handlerGet);

				let btnPost = document.querySelector("#btnPost");
				btnPost.removeEventListener("click", handlerPost);
				btnGet.addEventListener("click", handlerPost);
			}

			function request_async_fetch(){

				console.log("request_async_fetch");

				async function get(){

					console.log("GET:\n");

					let response = await fetch("http://127.0.0.1/html-js/people.json");

					if(!response.ok){
						throw new Error(`fetching error: ${response.status}`);
					}
					
					let people = await response.json();
					set_people_to_table(people);
				}

				//
				async function post(){

					console.log("POST:\n");

					let response = await fetch("http://127.0.0.1/html-js/people.json", {
						method: "POST",
						body: JSON.stringify({
							id: 10, name: "Vanessa"
						}),
						headers: {"Content-type": "application/json"},
					});

					if(!response.ok){
						throw new Error(`fetching error: ${response.status}`);
					}
					
					let people = await response.json();
					set_people_to_table(people);
				}

				function handlerGet() {
				    get();
				}

				function handlerPost() {
				    post();
				}
				
				let btnGet = document.querySelector("#btnGet");
				btnGet.removeEventListener("click", handlerGet);
				btnGet.addEventListener("click", handlerGet);

				let btnPost = document.querySelector("#btnPost");
				btnPost.removeEventListener("click", handlerPost);
				btnGet.addEventListener("click", handlerPost);
			}

			// window.onload = request_xmlhttprequest();

			window.onload = request_xmlhttprequest;

		</script>
