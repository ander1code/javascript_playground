<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>22.html</title>

	<style>
		.text{
			color:red;
			width:300px;
		}
	</style>
</head>
<body>

	<div id="container">
		<h1></h1>
		<button id="btnClick">Click</button>
		<button id="btnHide">Hide!</button>
	</div>

	<script src="libraries/jquery-1.12.4.min.js"></script>
	<script>
		
		let text = "Hello, World!";

		$(document).ready(function(){
			alert(text);
			let h = $("#container > h1");
			h.addClass("text");
			h.css({
				"background-color":"red",
				"color":"white",
			});
			h.text(text);

			let btnClick = $("#btnClick");

			btnClick.click(() => {
				alert("Hello, World!");
			});

			btnClick.css({
				"background-color": "blue",
				"color":"white",
				"width":"130px",
				"height":"40px",
				"cursor": "pointer"
			});

			let btnHide = $("#btnHide");

			btnHide.css({
				"background-color": "gray",
				"color":"white",
				"width":"130px",
				"height":"40px",
				"cursor": "pointer"
			});

			btnHide.click((e) => {
				let btn = $("#btnHide");
				btn.hide();
				setTimeout(function(){
					btn.show();
				}, 3000);
			});
		});

	</script>
</body>
</html>
