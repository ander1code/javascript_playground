<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>18.html</title>

	<style>
    	
	</style>
		
</head>
<body>
	<!--
		/*
		18 - Demonstre a criação dinâmica de nós no 
		DOM utilizando querySelectorAll, createElement, appendChild, manipulação de 
		atributos com setAttribute e removeAttribute, além de estilizá-los e 
		aninhá-los em diferentes linhas do documento.
		*/
	-->

	<div id="container"></div>

	<script>
		let container = document.querySelector("#container");

		let colors = ["red", "green", "yellow", "blue", "magenta", "black"];

		let headers = [];
		for(let i = 1; i <= 6; i++){
			let h = document.createElement(`h${i}`); // creating...
			h.style.color = colors[i - 1];
			h.textContent = "Hello, World!";
			h.setAttribute("id", `header_${i}`); // adicionando atributo
			headers.push(h);
		}

		for(let h of headers){
			console.log(h.id);
		}

		for(let h of headers){
			h.removeAttribute("id"); // removendo atributo
			container.appendChild(h);
		}

		for(let h of headers){
			if(h.id === ""){
				console.log("ID empty!");
			}
		}

		let query = document.querySelectorAll("h1, h2, h3, h4, h5, h6");
		console.log(query);
		
	</script>
</body>
</html>
