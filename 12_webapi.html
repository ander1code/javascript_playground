        function webapi_demo() {

            async function get() {

                try {

                    const response = await fetch(
                        "https://projects.apache.org/json/projects/commons-crypto.json"
                    );

                    if (!response.ok) {
                        throw new Error(
                            `HTTP Error: ${response.status}`
                        );
                    }

                    const result = await response.json();

                    console.log(result);

                } catch (error) {
                    console.log(error);
                }
            }


            async function post() {

                try {

                    const response = await fetch(
                        "https://projects.apache.org/json/projects/commons-crypto.json",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            }
                        }
                    );


                    if (!response.ok) {
                        throw new Error(
                            `HTTP Error: ${response.status}`
                        );
                    }


                    const result = await response.json();

                    console.log(result);

                } catch (error) {
                    console.log(error);
                }
            }


            async function main() {

                await get();
                await post();
            }


            main();
        }


        function xmlhttprequest_demo(){

                */

                request.addEventListener("readystatechange", () => {
                    if(request.readyState === 4){
                        if(request.status === 200){

                            /*
                            // show: request.responseText
                            
                            // console.log(request.responseText);

                            callback(request.responseText, undefined);

                            // criando objetos com o JSON:
                            const json = JSON.parse(request.responseText);
                            
                            // console.log(json, typeof json); // ... object

                                // show: request.responseText

        function get_promise_demo_execution()
        {
            const get_promise_demo = (name, opc) => {
                return new Promise((resolve, reject) => {
                    console.log(`${name} executing...`);
                    if(opc){
                        setTimeout(() => {
                            resolve("Resolved!");
                        }, 2000);
                    }else{
                        setTimeout(() => {
                            reject("Reject!"); 
                        }, 3000);
                    }
                });
            }

            // executions:

            // forma 01:
            async function Main(){
                try{
                    console.log(`form 01: ${await get_promise_demo("form 01", true)}`);
                }catch(error){
                    console.log(`form 01 Error: ${error}`);
                }
            }
            Main();

            // forma 02:
            get_promise_demo("form 02", true)
            .then((data) => console.log(`form 02: ${data}!`))
            .catch((error) => console.log(`Error: ${error}`));

            // forma 03:
            get_promise_demo("form 03", true, 
                (data) => console.log(`form 03: ${data}!`), 
                (error) => {
                    try{
                        console.log(`Error: ${error}`);
                    }catch(error){
                        console.log(`Error: ${error}`);
                    }
                }
            );
        }

        
        function get_promise_demo_correct_execution(){
            {
                const get_promise_demo = (name, opc, onResolve, onReject) => {
                    return new Promise((resolve, reject) => {
                        console.log(`${name} executing...`);

                        if(opc){
                            setTimeout(() => {
                                resolve("Resolved!");
                            }, 2000);
                        }else{
                            setTimeout(() => {
                                reject("Reject!"); 
                            }, 3000);
                        }
                    })
                    .then((data) => {
                        if(onResolve) onResolve(data);
                    })
                    .catch((error) => {
                        if(onReject) onReject(error);
                    });
                }

                // executions:

                // forma 01:

                    try{

        async function promise_with_xmlhttprequest(){


            const promise = new Promise((resolve, reject) => {
                const request = new XMLHttpRequest();

                request.onreadystatechange = (() => {
                    if(request.readyState === 4){
                        if(request.status === 200){
                            resolve(request.responseText);
                        }else{
                            reject("Error!");
                        }
                    }
                });

                request.open("GET", "http://127.0.0.1/test/peope.json");
                request.send();
            });

            try{
                console.log(await promise);
            }catch(error){
                console.log(`Error: ${error}`);
            }
        }

        async function execute_getAll()
        {
            /*
                O encadeamento é este
                    fetch()
                      ↓
                    response
                      ↓
                    response.ok
                      ↓
                    response.json()
                      ↓
                    data
                      ↓
                console.log(data)
            */

            const getAll = async (opc) => {
                if(opc == 1){
                    return await
                        fetch("http://127.0.0.1/test/people.json")
                        .then((response) => { 
                            if(response.ok){
                                return response.json();
                            }
                        })
                        .then((data) => { 
                            list_people(data);
                        })
                        .catch((error) =>{
                            console.log(error);
                        });
                }else{
                    const response = await fetch("http://127.0.0.1/test/peple.json");

                    if(response.status !== 200){
                        throw new Error("Error!");
                    }

                    const data = await response.json();

                    list_people(data);

                    return data;
                }
            }

            await getAll(1);
            await getAll(2);
        }

        async function promise_01(){
            async function do_this(name, milliseconds){
                let i = 0;
                return new Promise((resolve, reject) => {
                    let interval = setInterval(() => {
                        console.log(`${name}: ${i}`);
                        i++;
                        if(i == 10){
                            clearInterval(interval);
                            resolve();
                        }
                    }, milliseconds);
                });
            }

            await do_this("Task01", 500);
            await do_this("Task02", 100);
            await do_this("Task03", 300);
        }

        // promise_01();


        async function promise_02(){
            async function do_this(name, milliseconds){
                for(let i = 0; i < 10; i++){
                    console.log(`${name}: ${i}`);
                    await new Promise((resolve, reject) => {
                        setTimeout(() => {
                            resolve()
                        }, milliseconds);
                    })
                }
            }

            await do_this("Task01", 500);
            await do_this("Task02", 100);
            await do_this("Task03", 300);
        }
